name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Render PDF fixtures
        run: npx tsx scripts/render-pdf-fixtures.ts
      - name: Upload PDF fixtures
        uses: actions/upload-artifact@v4
        with:
          name: pdf-fixtures
          path: artifacts/pdf-fixtures/*.pdf
          if-no-files-found: error
